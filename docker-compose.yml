services:
  website1:
    image: nginx:latest
    container_name: website1
    ports:
      - "8081:80"
    volumes:
      - ./website1:/usr/share/nginx/html
    networks:
      - website-network

  website2:
    image: nginx:latest
    container_name: website2
    ports:
      - "8082:80"
    volumes:
      - ./website2:/usr/share/nginx/html
    networks:
      - website-network

networks:
  website-network:
    driver: bridge
