
services:
  website1:
    image: arjunsanthosh803/website1:latest
    build:
      context: .
      dockerfile: dockerfile-website1
    container_name: website1
    ports:
      - "8081:80"
    volumes:
      - ./website1:/usr/share/nginx/html
    networks:
      - website-network
    restart: unless-stopped

  website2:
    image: arjunsanthosh803/website2:latest
    build:
      context: .
      dockerfile: dockerfile-website2
    container_name: website2
    ports:
      - "8082:80"
    volumes:
      - ./website2:/usr/share/nginx/html
    networks:
      - website-network
    restart: unless-stopped

networks:
  website-network:
    driver: bridge
